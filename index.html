<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="script.js" defer></script>
		<title>Flownotes</title>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<header>
			<h1>Flownotes</h1>
			<div class="logo">
				<img
					src="https://static.vecteezy.com/system/resources/thumbnails/053/366/663/small_2x/wave-rgb-color-icon-symbolizing-ocean-tides-currents-coastal-and-marine-environments-tsunami-natural-disaster-isolated-illustration-simple-filled-line-drawing-editable-stroke-vector.jpg"
					alt="Flownotes Logo" />
			</div>
		</header>

		<div id="preferencesWrapper">
			<form id="preferencesForm">
				<label for="backgroundColor">Background Color:</label>

				<input
					type="text"
					id="backgroundColor"
					name="backgroundColor"
					placeholder="Background Color" />

				<label for="fontColor">Font Color:</label>
				<input
					type="text"
					id="fontColor"
					name="fontColor"
					placeholder="Font Color" />

				<label for="buttonColor">Button Color:</label>
				<input
					type="text"
					id="buttonColor"
					name="buttonColor"
					placeholder="Button Color" />
			</form>
			<button type="submit" id="applyPreferenceButton" form="preferencesForm">
				Apply
			</button>
		</div>

		<button id="userPreferencesButton">Show/Hide User Preferences</button>

		<div id="appControlsWrapper">
			<h5>Control Panel</h5>

			<div class="headerWrapper-c">
				<form id="createSessionForm">
					<label for="sessionName">Create New Session:</label>
					<input type="text" id="sessionName" name="sessionName" />
					<div id="createSessionButtonsWrapper">
						<button type="button" id="createSessionAFButton">
							Current Date
						</button>
						<button type="submit">Submit</button>
					</div>
				</form>
			</div>

			<div class="headerWrapper">
				<h5>Session List</h5>
				<ul id="sessionList"></ul>
			</div>

			<div class="headerWrapper-c">
				<h5>Current Session: <span id="currentSessionName"></span></h5>
			</div>

			<div class="headerWrapper">
				<h5>Session History</h5>
				<button id="exportAll">Export All</button>
				<ol id="sessionHistory"></ol>
			</div>

			<div class="headerWrapper">
				<h5>Note Preview</h5>
				<div id="previewContainer"></div>
				<button id="closePreviewButton">Close Preview</button>
			</div>
		</div>

		<button id="hideControlPanelButton">Show Control Panel</button>

		<button type="button" id="fillTestData">Fill Test Data</button>
		<hr />

		<footer>
			<p>
				Flownotes &copy; 2026 | GitHub:
				<a href="https://github.com/Lain-lies/worknotes" target="_blank"
					>Flownotes</a
				>
				| Made by: Kenjie Tarasona
			</p>

			<p>
				For questions, suggestions, or bug reports please send an email to
				<a href="mailto:annabel.tejoso@atos.ai">annabel.tejoso@atos.ai</a> or
				send a message on teams.
			</p>
		</footer>
	</body>
</html>
